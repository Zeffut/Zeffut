name: README

# Le README et les SVG sont régénérés depuis l'état réel du profil.
# Changer de direction artistique : Settings → Variables → README_THEME
# (chunk | replay | deepslate), ou via « Run workflow » ci-dessous.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/readme.yml']
  workflow_dispatch:
    inputs:
      theme:
        description: Direction artistique
        type: choice
        options: [chunk, replay, deepslate]
        default: chunk

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Régénérer le README et les SVG
        env:
          # README_TOKEN (PAT avec read:user) fait remonter aussi les
          # contributions privées. Sans lui, GITHUB_TOKEN ne voit que le public.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
          README_THEME: ${{ inputs.theme || vars.README_THEME || 'chunk' }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build.mjs

      - name: Publier s'il y a du changement
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          git diff --staged --quiet && echo 'Rien à publier.' && exit 0
          git commit -m "README: régénération automatique ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
